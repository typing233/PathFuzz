openapi: "3.0.3"
info:
  title: Pet Store API
  version: "1.0.0"
servers:
  - url: http://localhost:8080/api/v1

paths:
  /pets:
    get:
      summary: List all pets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          example: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          example: 0
      responses:
        "200":
          description: A list of pets

    post:
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - species
              properties:
                name:
                  type: string
                  example: "Buddy"
                species:
                  type: string
                  example: "Dog"
                age:
                  type: integer
                  example: 3
                weight:
                  type: number
                  example: 12.5
                vaccinated:
                  type: boolean
                  example: true
      responses:
        "201":
          description: Pet created

  /pets/{petId}:
    get:
      summary: Get a pet by ID
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: A pet

    put:
      summary: Update a pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Buddy Updated"
                age:
                  type: integer
                  example: 4
      responses:
        "200":
          description: Pet updated

    delete:
      summary: Delete a pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "204":
          description: Pet deleted

  /pets/{petId}/vaccinations:
    post:
      summary: Add vaccination record
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vaccine_name
                - date
              properties:
                vaccine_name:
                  type: string
                  example: "Rabies"
                date:
                  type: string
                  example: "2024-01-15"
                notes:
                  type: string
      responses:
        "201":
          description: Vaccination record created
