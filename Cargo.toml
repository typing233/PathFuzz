[package]
name = "pathfuzz"
version = "0.1.0"
edition = "2021"

[dependencies]
libafl = "0.15"
libafl_bolts = "0.15"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
log = "0.4"
env_logger = "0.11"
